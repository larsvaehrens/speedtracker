name: Deploy SpeedTracker

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: speedtracker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate production configuration
        run: |
          if grep -Fq '00000000-0000-0000-0000-000000000001' wrangler.jsonc; then
            echo 'Replace the placeholder D1 database ID before deploying.'
            exit 1
          fi
          if grep -Fq 'speedtracker.example.com' wrangler.jsonc; then
            echo 'Set BETTER_AUTH_URL to the production HTTPS origin before deploying.'
            exit 1
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply speedtracker-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
