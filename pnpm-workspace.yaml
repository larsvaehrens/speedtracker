allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - miniflare@5.20260926.1-alpha
  - tinyrainbow@3.2.0
  - wrangler@4.144.0
