allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd

catalog:
  "@better-auth/drizzle-adapter": 1.7.19
  "@cloudflare/vite-plugin": 1.68.0
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.5
  "@tanstack/router-cli": 1.168.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  better-auth: 1.7.19
  drizzle-orm: 0.45.4
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  wrangler: 4.159.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - miniflare@5.20260926.1-alpha
  - tinyrainbow@3.2.0
  - wrangler@4.144.0
  - "@better-auth/core@1.7.15"
  - "@better-auth/drizzle-adapter@1.7.15"
  - "@better-auth/kysely-adapter@1.7.15"
  - "@better-auth/memory-adapter@1.7.15"
  - "@better-auth/mongo-adapter@1.7.15"
  - "@better-auth/prisma-adapter@1.7.15"
  - "@better-auth/telemetry@1.7.15"
  - better-auth@1.7.15
