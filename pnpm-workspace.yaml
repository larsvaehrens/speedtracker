allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd

catalog:
  "@better-auth/drizzle-adapter": 1.7.6
  "@cloudflare/vite-plugin": 1.62.2
  "@tanstack/react-router": 1.170.40
  "@tanstack/react-start": 1.168.59
  "@tanstack/router-cli": 1.167.39
  "@types/node": 22.20.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  better-auth: 1.7.6
  drizzle-orm: 0.45.3
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.1.0
  vitest: 5.0.1
  wrangler: 4.144.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - miniflare@5.20260926.1-alpha
  - tinyrainbow@3.2.0
  - wrangler@4.144.0
